<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embalagens</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            font-size: 12pt;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        tr {
            page-break-inside: avoid;
        }

        th, td {
            border: 1px solid #000;
            padding: 4px;
            text-align: left;
        }

        @page {
            size: A4;
            margin: 0;
            padding: 0;
        }

        @media print {
            html, body {
                width: 210mm;
                height: 297mm;
            }
        }
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Comprimento (cm)</th>
        <th>Largura (cm)</th>
        <th>Profundidade (cm)</th>
        <th>Tara (g)</th>
        <th>Resistência (kg)</th>
    </tr>
    </thead>
    <tbody id="container-table-body">

    </tbody>
</table>
<script>
    const container_data = %DATA%;
    const tableBody = document.getElementById('container-table-body');
    container_data.forEach(container => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${container.id}</td>
            <td>${container.dimensions.length}</td>
            <td>${container.dimensions.width}</td>
            <td>${container.dimensions.height}</td>
            <td>${container.base_weight}</td>
            <td>${container.capacity/1000}</td>
        `;
        tableBody.appendChild(row);
    });
</script>
</body>
</html>
